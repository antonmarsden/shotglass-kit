name: CI

on:
  push:
  pull_request:
  # canary.yml calls this with shotglass_ref: main to test against unpinned shotglass.
  workflow_call:
    inputs:
      shotglass_ref:
        description: "shotglass branch to build instead of SHOTGLASS_REV"
        type: string
        default: ""

# shotglass is pinned so a new engine can't turn CI red on its own. To upgrade:
# bump SHOTGLASS_REV to a commit on shotglass main, fix anything new, commit both.
env:
  SHOTGLASS_REV: "efaac0ffd43e8509747d9efb63aab995c0b49274"
  RUST_TOOLCHAIN: "1.100.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev xvfb libgl1-mesa-dri libegl-mesa0 libxkbcommon-x11-0
      - name: shotglass commit under test
        id: rev
        env:
          REF: ${{ inputs.shotglass_ref }}
        run: |
          if [ -n "$REF" ]; then
            rev=$(git ls-remote https://github.com/antonmarsden/shotglass "refs/heads/$REF" | cut -f1)
            [ -n "$rev" ] || { echo "::error::shotglass has no branch '$REF'"; exit 1; }
          else
            rev=$SHOTGLASS_REV
          fi
          echo "sha=$rev" >> "$GITHUB_OUTPUT"
          echo "::notice title=shotglass::testing against antonmarsden/shotglass@$rev${REF:+ ($REF)}"
          echo "shotglass under test: \`$rev\`${REF:+ ($REF)}" >> "$GITHUB_STEP_SUMMARY"
      - name: Cached shotglass
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/shotglass
          key: shotglass-${{ steps.rev.outputs.sha }}-${{ runner.os }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Build shotglass
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          REV: ${{ steps.rev.outputs.sha }}
        run: cargo install --locked --git https://github.com/antonmarsden/shotglass --rev "$REV" shotglass

      # Each library folder and the name the test films include it by
      # (#include <kit/noise.glsl> is core/noise.glsl). Add new libraries here.
      - name: Library list
        run: echo 'LIBS=core:kit transitions:transitions sound:sound text:text fx:fx blend:blend quality:quality' >> "$GITHUB_ENV"

      # fx/ and blend/ passes are used by name from a layer (type = "fx/grade", blend =
      # "blend/screen"), and quality/ metrics from a metric test (tests/unit/quality/
      # *.test.toml: use = "quality/picture/alias"), not included; their helper file (ops.glsl, modes.glsl) is
      # included by the passes and metrics.
      - name: Every library file is used by a test film
        run: |
          missing=0
          for entry in $LIBS; do
            lib=${entry%%:*}; prefix=${entry##*:}
            # quality/ keeps its metrics in picture/ and sound/: "quality/picture/alias".
            for f in $lib/*.glsl $lib/*/*.glsl; do
              [ -e "$f" ] || continue
              name=${f#$lib/}; name=${name%.glsl}
              inc="#include <$prefix/$name.glsl>"
              if grep -rqF --exclude-dir=unit "$inc" tests; then continue; fi
              if grep -rqE --include=movie.toml --include='*.test.toml' "\"$prefix/$name\"" tests; then continue; fi
              if grep -rlF --include='*.glsl' -e "#include \"$name.glsl\"" -e "#include \"../$name.glsl\"" $lib > /dev/null 2>&1; then continue; fi
              echo "::error file=$f::not used by any test film under tests/ (add: $inc, a layer with \"$prefix/$name\", or a *.test.toml metric case)"
              missing=1
            done
          done
          exit $missing

      # The kit ships no fonts: test films use Google Fonts families declared as libraries
      # in shotglass.toml and pinned in shotglass.lock (shotglass fetches them).
      - name: No font files in the kit
        run: |
          found=$(git ls-files '*.ttf' '*.otf' '*.ttc' '*.TTF' '*.OTF' '*.TTC')
          if [ -n "$found" ]; then
            for f in $found; do echo "::error file=$f::declare Google Fonts families in shotglass.toml (shotglass fonts add) instead of committing font files"; done
            exit 1
          fi

      # CONVENTIONS.md §6: calling it, not just including the file. The functions in fx/
      # and blend/ are called by the passes (another file of the same library), which
      # tests/layers draws; those in quality/ by the metrics, which tests/unit/quality/*.test.toml runs.
      - name: Every public function is called by a test film
        run: |
          missing=0
          for f in fx/*.glsl blend/*.glsl quality/*.glsl; do
            for fn in $(grep -oE '^[a-z0-9_]+ kit_[a-z0-9]+(_[a-z0-9]+)*\(' "$f" | sed -E 's/^[a-z0-9_]+ //; s/\($//' | sort -u); do
              if ! grep -rlE --include='*.glsl' "\b$fn *\(" "$(dirname "$f")" | grep -qvxF "$f"; then
                echo "::error file=$f::$fn is never called by a pass in its library"
                missing=1
              fi
            done
          done
          for f in core/*.glsl sound/*.glsl text/*.glsl; do
            for fn in $(grep -oE '^[a-z0-9_]+ kit_[a-z0-9]+(_[a-z0-9]+)*\(' "$f" | sed -E 's/^[a-z0-9_]+ //; s/\($//' | sort -u); do
              if ! grep -rqE --exclude-dir=unit "\b$fn *\(" tests; then
                echo "::error file=$f::$fn is never called by a test film under tests/"
                missing=1
              fi
            done
          done
          exit $missing

      # CONVENTIONS.md §6: every public function's contract has a unit test. Mix-only
      # files (`// sound: mix only`) are skipped: they read the mix's buses, which only
      # a mix shader has, so tests/mix covers them.
      - name: Every public function has a unit test
        run: |
          missing=0
          for f in $(grep -L '^// sound: mix only' core/*.glsl sound/*.glsl text/*.glsl fx/*.glsl blend/*.glsl quality/*.glsl); do
            for fn in $(grep -oE '^[a-z0-9_]+ kit_[a-z0-9]+(_[a-z0-9]+)*\(' "$f" | sed -E 's/^[a-z0-9_]+ //; s/\($//' | sort -u); do
              if ! grep -rqE "\b$fn *\(" tests/unit; then
                echo "::error file=$f::$fn has no unit test under tests/unit/ (CONTRIBUTING.md, \"Unit-test its contract\")"
                missing=1
              fi
            done
          done
          exit $missing

      # CONVENTIONS.md §5: a file that says it's sound-safe is compiled as sound too.
      - name: Every sound-safe file is included by a test film's music, every mix-only file by its mix
        run: |
          missing=0
          for entry in $LIBS; do
            lib=${entry%%:*}; prefix=${entry##*:}
            [ "$lib" = transitions ] && continue
            for f in $(grep -l '^// sound: yes' $lib/*.glsl); do
              inc="#include <$prefix/$(basename "$f")>"
              if ! grep -qF "$inc" tests/*/music.glsl; then
                echo "::error file=$f::says sound: yes but no tests/*/music.glsl includes it (add: $inc)"
                missing=1
              fi
              # glslang can't catch these: sound shaders are fragment shaders too.
              if grep -nE '\bdFdx|\bdFdy|\bfwidth|\bgl_FragCoord|\bdiscard|\btexture *\(' "$f"; then
                echo "::error file=$f::says sound: yes but uses derivatives, gl_FragCoord, discard or texture() (CONVENTIONS.md §5)"
                missing=1
              fi
            done
            # mix-only files call music()/sfx(), which only a mix shader has
            for f in $(grep -l '^// sound: mix only' $lib/*.glsl); do
              inc="#include <$prefix/$(basename "$f")>"
              if ! grep -qF "$inc" tests/*/mix.glsl; then
                echo "::error file=$f::says sound: mix only but no tests/*/mix.glsl includes it (add: $inc)"
                missing=1
              fi
              if grep -nE '\bdFdx|\bdFdy|\bfwidth|\bgl_FragCoord|\bdiscard|\btexture *\(' "$f"; then
                echo "::error file=$f::a mix-only file uses derivatives, gl_FragCoord, discard or texture() (CONVENTIONS.md §5)"
                missing=1
              fi
            done
            for f in $lib/*.glsl $lib/*/*.glsl; do
              [ -e "$f" ] || continue
              if ! grep -qE '^// sound: (yes|mix only|picture only|metric only)' "$f"; then
                echo "::error file=$f::header doesn't say '// sound: yes', '// sound: mix only', '// sound: picture only' or '// sound: metric only'"
                missing=1
              fi
            done
          done
          exit $missing

      # glslang, independent of any driver: GLSL 3.30 core and GLSL ES 3.00 (WebGL 2).
      - name: Strict GLSL check
        run: |
          shotglass check tests/film --web --no-gpu
          shotglass check tests/animation --web --no-gpu
          shotglass check tests/sound --web --no-gpu
          shotglass check tests/instruments --web --no-gpu
          shotglass check tests/mix --web --no-gpu
          shotglass check tests/transitions --web --no-gpu
          shotglass check tests/text --web --no-gpu
          shotglass check tests/layers --web --no-gpu

      # Unit and property tests of each function's documented contract (tests/unit,
      # `shotglass test`: engine assertions, run on the GPU). Each file also passes the
      # strict check (330 and ES 3.00) first. See "Unit tests" in CONTRIBUTING.md. Also
      # the quality/ metric tests (tests/unit/quality/*.test.toml): each metric must pass
      # its must-pass cases and fail its must-fail ones.
      - name: Unit tests
        run: xvfb-run -a shotglass test tests/unit

      # Mesa's software OpenGL: compiles every shader for real and renders frames.
      - name: Render on Mesa
        run: |
          xvfb-run -a shotglass check tests/film --size 320x180 --frames 1
          xvfb-run -a shotglass check tests/animation --size 320x180 --frames 1
          xvfb-run -a shotglass check tests/sound --size 320x180 --frames 1
          xvfb-run -a shotglass check tests/instruments --size 320x180 --frames 1
          xvfb-run -a shotglass check tests/mix --size 320x180 --frames 1
          xvfb-run -a shotglass check tests/text --size 320x180 --frames 1
          xvfb-run -a shotglass check tests/layers --size 320x180 --frames 1

      # Golden picture (tests/golden/film.png, an llvmpipe render like the engine's golden
      # tests): one frame of each test-film scene and two transitions mid-way, so a change
      # in the output of any core/ function shows up. noise, colour and the sun's SDF (dusk,
      # late, stars out); 2D SDFs and operators (house, windows lit); 3D SDFs, raymarching
      # (toys, garden: soft shadows, AO, sdf_ops); camera.glsl (orbit with depth of field,
      # dolly zoom); iris and wipe half-way. Within `strip --compare`'s default tolerance,
      # so real GPUs pass too. To update it on purpose: "Golden picture" in CONTRIBUTING.md.
      - name: Test film matches its golden picture
        run: |
          mkdir -p golden-out
          xvfb-run -a shotglass strip tests/film --size 320x180 --cols 4 --out golden-out/film.png \
            --at "$FILM_FRAMES" --compare tests/golden/film.png
        env:
          FILM_FRAMES: dusk+2.2,house+1.8,toys+1.6,garden+1.8,camera-orbit+2.6,camera-vertigo+2.0,toys+0.4,house-again+0.3,cellular+1,simplex-flow+1,blue-noise+1

      # Golden picture of tests/animation (core/animate.glsl): the crouch, the leap, the
      # top, just after the first landing (on ones squashed, on twos still holding the
      # drawing before it), up again, the second landing, the settle, at rest. The plots
      # on the right draw every ease and helper. Same tolerance and update steps as above.
      - name: Animation film matches its golden picture
        run: |
          mkdir -p golden-out
          xvfb-run -a shotglass strip tests/animation --size 320x180 --cols 4 --out golden-out/animation.png \
            --at "$ANIMATION_FRAMES" --compare tests/golden/animation.png
        env:
          ANIMATION_FRAMES: bounce+0.541667,bounce+0.958333,bounce+1.291667,bounce+1.775,bounce+2.041667,bounce+2.25,bounce+2.708333,bounce+3.041667

      # Golden picture of tests/text (text/ with Google Fonts families): the title fading
      # in and in full (shadow, glow, outline, gradient ink, the tagline from coverage),
      # the lower third sliding in and in place (baseline alignment, anchoring, edge
      # offsets, kit_text_offset echoes). Larger frames than the other films, so the
      # small text is more than a few pixels. Same tolerance and update steps as above.
      - name: Text film matches its golden picture
        run: |
          mkdir -p golden-out
          xvfb-run -a shotglass strip tests/text --size 480x270 --cols 2 --out golden-out/text.png \
            --at "$TEXT_FRAMES" --compare tests/golden/text.png
        env:
          TEXT_FRAMES: title+0.5,title+2.5,lower-third+0.4,lower-third+2.5

      # Golden picture of tests/layers (fx/ and blend/): the 11 blend modes over the same
      # picture and swatch (one second each), then grade, grain, vignette, letterbox,
      # place, bloom with screen and add, and chroma key. Same tolerance and update
      # steps as above. Moving SHOTGLASS_REV can change it: the engine does the compositing.
      - name: Layers film matches its golden picture
        run: |
          mkdir -p golden-out
          xvfb-run -a shotglass strip tests/layers --size 320x180 --cols 4 --out golden-out/layers.png \
            --at "$LAYERS_FRAMES" --compare tests/golden/layers.png
        env:
          LAYERS_FRAMES: base+0.5,base+1.5,base+2.5,base+3.5,base+4.5,base+5.5,base+6.5,base+7.5,base+8.5,base+9.5,base+10.5,base+11.5,base+12.5,base+13.5,base+14.5,base+15.5,base+16.5,base+17.5,key-backdrop+0.5

      # Every kit transition, with and without parameters, starts exactly on the old shot
      # and ends exactly on the new one (zero tolerance). The engine's own selftest checks
      # this with fixture transitions; this checks the kit's. See the script's header.
      - name: Transition endpoints
        run: xvfb-run -a .github/transition-endpoints.sh golden-out/transitions

      # Golden soundtracks (tests/golden/<film>.wav, 8 kHz like the engine's golden tests),
      # rendered on Mesa. Within `wav --compare`'s default tolerance, so real GPUs pass too.
      # To update one on purpose, see "Audio references" in README.md.
      - name: Soundtracks match their references
        run: |
          mkdir -p golden-out
          xvfb-run -a shotglass wav tests/sound --rate 8000 --out golden-out/sound.wav \
            --compare tests/golden/sound.wav
          xvfb-run -a shotglass wav tests/instruments --rate 8000 --out golden-out/instruments.wav \
            --compare tests/golden/instruments.wav
          xvfb-run -a shotglass wav tests/mix --rate 8000 --out golden-out/mix.wav \
            --compare tests/golden/mix.wav
      - if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-film-strip
          path: |
            golden-out/film.png
            golden-out/animation.png
            golden-out/text.png
            golden-out/layers.png
          if-no-files-found: ignore
      # The actual renders next to their diffs: <name>.diff.png (magenta = differs),
      # <name>.diff.wav, and transitions/ (expected.png, endpoints.png, endpoints.diff.png).
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: golden-out/
          if-no-files-found: ignore
