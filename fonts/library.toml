# Fonts only, no GLSL: name them in a film's [fonts] as "<fonts/inter/Inter-Variable.ttf>"
# (with the library called "fonts" in shotglass.toml). Every file is shipped unmodified
# from github.com/google/fonts, under the SIL Open Font License 1.1; each family's
# OFL.txt sits next to its fonts. See README.md.
name = "shotglass-kit/fonts"
version = "0.1.0"
requires_shotglass = "0.1.3"
licences = ["OFL-1.1"]
