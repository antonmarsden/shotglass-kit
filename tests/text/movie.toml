# The text library's test film: a title card and a lower third, drawn with text/ from
# blocks set in Google Fonts families. Every text/ function is called here. CI checks it
# strictly (GLSL 3.30 and GLSL ES 3.00), renders it on Mesa and compares it with
# tests/golden/text.png. The kit's libraries come from this checkout (shotglass.toml at
# the kit's root); the fonts are fetched at the commit shotglass.lock pins.
title = "shotglass-kit text"
aspect = [16, 9]

[fonts]
# Google Fonts families, declared as libraries in the kit's shotglass.toml and pinned in
# shotglass.lock (`shotglass fonts add "Bungee" "Inter" "Atkinson Hyperlegible"`).
display = "<bungee/Bungee-Regular.ttf>"
sans = "<inter/Inter[opsz,wght].ttf>"
sans_bold = { file = "<inter/Inter[opsz,wght].ttf>", variations = { wght = 700 } }
legible = "<atkinsonhyperlegible/AtkinsonHyperlegible-Regular.ttf>"
legible_bold = "<atkinsonhyperlegible/AtkinsonHyperlegible-Bold.ttf>"

[texts]
# Rasterised at different sizes on purpose: the scenes size them by em, so the size
# here only sets the quality. The title is magnified, the tagline drawn smaller.
title = { text = "Big Shadow", font = "display", size = 96, sdf_spread = 16 }
tagline = { text = "a tiny mouse, a tealight,\nand a lot of wall", font = "sans", size = 72, align = "center" }
name = { text = "Ada Mouse", font = "sans_bold", size = 64 }
role = { text = "director", font = "legible", size = 40 }
note = { text = "shotglass-kit/text", font = "legible_bold", size = 32 }

[[shot]]
id = "title"
scene = "scenes/title.glsl"
duration = 3
channels = ["title", "tagline"]
uniforms.uIn = { keys = [[0.0, 0.0], [1.5, 1.0]], ease = "smooth" }

[[shot]]
id = "lower-third"
scene = "scenes/lower_third.glsl"
duration = 3
channels = ["name", "role", "note"]
uniforms.uIn = { keys = [[0.0, 0.0], [1.0, 1.0]], ease = "out" }
