# quality/sound/*: each metric on a sound it must pass and one it must fail. Inputs are
# in fixtures/ (mainSound, at 48 kHz).
samples = 96000                       # two seconds

[[case]]
name = "clicks: notes that fade in and out"
use = "quality/sound/clicks"
sound = "fixtures/notes-faded.glsl"
range = [0, 100]
threshold = 20
max = { max = 20 }

[[case]]
name = "clicks: notes cut mid-wave"
use = "quality/sound/clicks"
sound = "fixtures/notes-cut.glsl"
range = [0, 100]
threshold = 20
expect = "fail"
max = { max = 20 }
